<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña - AndyAxcel</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <h1>🎬 AndyAxcel</h1>
            <h2>Recuperar Contraseña</h2>
            
            <form id="forgotForm">
                <div class="form-group">
                    <label>Correo Electrónico</label>
                    <input type="email" id="email" placeholder="ejemplo@gmail.com" required>
                </div>
                
                <div id="message" class="alert alert-success" style="display:none;"></div>
                <div id="error" class="alert alert-error" style="display:none;"></div>
                
                <button type="submit" class="btn btn-primary btn-full">Enviar Enlace</button>
            </form>
            
            <p class="auth-footer">
                <a href="login.html">Volver al inicio de sesión</a>
            </p>
        </div>
    </div>

    <script>
        document.getElementById('forgotForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            
            try {
                const res = await fetch('/api/auth/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ correo: email })
                });
                
                const data = await res.json();
                document.getElementById('message').textContent = data.message;
                document.getElementById('message').style.display = 'block';
            } catch(e) {
                document.getElementById('error').textContent = 'Error de conexión';
                document.getElementById('error').style.display = 'block';
            }
        });
    </script>
</body>
</html>
