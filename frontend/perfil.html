<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil - AndyAxcel</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="nav-logo">🎬 AndyAxcel</a>
            <div class="nav-actions">
                <a href="/index.html" class="btn btn-outline">Inicio</a>
                <button onclick="logout()" class="btn btn-danger">Cerrar Sesión</button>
            </div>
        </div>
    </nav>

    <main style="max-width:800px;margin:40px auto;padding:20px;">
        <div class="card" style="text-align:center;padding:40px;">
            <img id="profilePic" src="/uploads/default-avatar.png" 
                 style="width:120px;height:120px;border-radius:50%;object-fit:cover;border:4px solid #FF4444;">
            <h2 id="profileName" style="margin-top:20px;">Cargando...</h2>
            <p id="profileUsername" style="color:#666;">@username</p>
        </div>

        <div class="card" style="margin-top:20px;padding:30px;">
            <h3>Información Personal</h3>
            <div style="margin-top:20px;">
                <p><strong>Email:</strong> <span id="infoEmail">-</span></p>
                <p><strong>Teléfono:</strong> <span id="infoPhone">-</span></p>
                <p><strong>Rol:</strong> <span id="infoRole">-</span></p>
                <p><strong>Miembro desde:</strong> <span id="infoDate">-</span></p>
            </div>
            
            <button onclick="openEditModal()" class="btn btn-primary" style="margin-top:20px;">
                ✏️ Editar Perfil
            </button>
        </div>
    </main>

    <!-- Modal Editar -->
    <div id="editModal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:1000;align-items:center;justify-content:center;">
        <div style="background:white;padding:30px;border-radius:16px;max-width:400px;width:90%;">
            <h3>Editar Perfil</h3>
            <form id="editForm" style="margin-top:20px;">
                <div class="form-group">
                    <label>Nombre</label>
                    <input type="text" id="editNombre" required>
                </div>
                <div class="form-group">
                    <label>Teléfono</label>
                    <input type="tel" id="editTelefono">
                </div>
                <div style="display:flex;gap:10px;margin-top:20px;">
                    <button type="button" onclick="closeEditModal()" class="btn btn-outline btn-full">Cancelar</button>
                    <button type="submit" class="btn btn-primary btn-full">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/main.js"></script>
    <script>
        const token = CookieManager.get('token');
        if (!token) window.location.href = '/login.html';

        async function loadProfile() {
            try {
                const res = await fetch('/api/users/profile', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                
                if (data.success) {
                    const u = data.data;
                    document.getElementById('profileName').textContent = u.nombre;
                    document.getElementById('profileUsername').textContent = '@' + u.usuario;
                    document.getElementById('infoEmail').textContent = u.correo;
                    document.getElementById('infoPhone').textContent = u.telefono || 'No especificado';
                    document.getElementById('infoRole').textContent = u.rol === 'ADMIN' ? 'Administrador' : 'Usuario';
                    document.getElementById('infoDate').textContent = new Date(u.fecha_registro).toLocaleDateString('es-ES');
                    
                    if (u.foto_perfil && u.foto_perfil !== '/uploads/default-avatar.png') {
                        document.getElementById('profilePic').src = u.foto_perfil;
                    }
                    
                    document.getElementById('editNombre').value = u.nombre;
                    document.getElementById('editTelefono').value = u.telefono || '';
                }
            } catch(e) {
                alert('Error al cargar perfil');
            }
        }

        function openEditModal() {
            document.getElementById('editModal').style.display = 'flex';
        }

        function closeEditModal() {
            document.getElementById('editModal').style.display = 'none';
        }

        document.getElementById('editForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            try {
                const res = await fetch('/api/users/profile', {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        nombre: document.getElementById('editNombre').value,
                        telefono: document.getElementById('editTelefono').value
                    })
                });
                
                const data = await res.json();
                if (data.success) {
                    alert('Perfil actualizado');
                    closeEditModal();
                    loadProfile();
                } else {
                    alert(data.error || 'Error');
                }
            } catch(e) {
                alert('Error de conexión');
            }
        });

        function logout() {
            fetch('/api/auth/logout', { method: 'POST' })
                .finally(() => window.location.href = '/login.html');
        }

        loadProfile();
    </script>
</body>
</html>
