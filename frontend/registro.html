<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - AndyAxcel</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card" style="max-width:500px;">
            <h1>🎬 AndyAxcel</h1>
            <h2>Crear Cuenta</h2>
            
            <!-- Google Register -->
            <button class="btn-google" onclick="handleGoogleRegister()">
                <span style="font-size:1.2rem;">G</span> Registrarse con Google
            </button>
            
            <div class="auth-divider"><span>o regístrate con tu correo</span></div>
            
            <!-- Register Form -->
            <form id="registerForm">
                <div class="form-group">
                    <label for="nombre">Nombre Completo *</label>
                    <input type="text" id="nombre" name="nombre" 
                           placeholder="Tu nombre completo" required>
                </div>
                
                <div class="form-group">
                    <label for="usuario">Nombre de Usuario *</label>
                    <input type="text" id="usuario" name="usuario" 
                           placeholder="Elige un nombre de usuario" required>
                    <small>Solo letras, números, puntos y guiones</small>
                </div>
                
                <div class="form-group">
                    <label for="correo">Correo Electrónico (Gmail) *</label>
                    <input type="email" id="correo" name="correo" 
                           placeholder="ejemplo@gmail.com" required>
                </div>
                
                <div class="form-group">
                    <label for="contraseña">Contraseña *</label>
                    <input type="password" id="contraseña" name="contraseña" 
                           placeholder="Mínimo 8 caracteres" required>
                    <small>Debe contener: mayúscula, minúscula, número y carácter especial</small>
                </div>
                
                <div class="form-group">
                    <label for="confirmar">Confirmar Contraseña *</label>
                    <input type="password" id="confirmar" name="confirmar" 
                           placeholder="Repite tu contraseña" required>
                </div>
                
                <div class="form-group">
                    <label for="telefono">Teléfono <span style="color:#999;">(opcional)</span></label>
                    <input type="tel" id="telefono" name="telefono" 
                           placeholder="+1234567890">
                </div>
                
                <div class="form-group">
                    <label>
                        <input type="checkbox" id="terminos" required>
                        Acepto los <a href="#">Términos de Servicio</a> y <a href="#">Política de Privacidad</a>
                    </label>
                </div>
                
                <div id="errorMessage" class="alert alert-error" style="display:none;"></div>
                <div id="successMessage" class="alert alert-success" style="display:none;"></div>
                
                <button type="submit" class="btn btn-primary btn-full" id="registerBtn">
                    <span id="btnText">Crear Cuenta</span>
                    <span id="btnLoader" style="display:none;">⏳ Registrando...</span>
                </button>
            </form>
            
            <p class="auth-footer">
                ¿Ya tienes una cuenta? <a href="login.html">Inicia sesión aquí</a>
            </p>
        </div>
    </div>

    <script src="js/main.js"></script>
    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const nombre = document.getElementById('nombre').value.trim();
            const usuario = document.getElementById('usuario').value.trim();
            const correo = document.getElementById('correo').value.trim();
            const contraseña = document.getElementById('contraseña').value;
            const confirmar = document.getElementById('confirmar').value;
            const telefono = document.getElementById('telefono').value.trim();
            
            // Validaciones
            if (!nombre || !usuario || !correo || !contraseña || !confirmar) {
                showError('Todos los campos marcados con * son requeridos');
                return;
            }
            
            if (nombre.length < 3) {
                showError('El nombre debe tener al menos 3 caracteres');
                return;
            }
            
            if (usuario.length < 3) {
                showError('El usuario debe tener al menos 3 caracteres');
                return;
            }
            
            if (!/^[a-zA-Z0-9._-]+$/.test(usuario)) {
                showError('El usuario solo puede contener letras, números, puntos y guiones');
                return;
            }
            
            if (!correo.endsWith('@gmail.com')) {
                showError('Debe usar un correo de Gmail (@gmail.com)');
                return;
            }
            
            if (contraseña.length < 8) {
                showError('La contraseña debe tener al menos 8 caracteres');
                return;
            }
            
            if (!/[A-Z]/.test(contraseña)) {
                showError('La contraseña debe contener al menos una mayúscula');
                return;
            }
            
            if (!/[0-9]/.test(contraseña)) {
                showError('La contraseña debe contener al menos un número');
                return;
            }
            
            if (!/[!@#$%^&*(),.?":{}|<>]/.test(contraseña)) {
                showError('La contraseña debe contener al menos un carácter especial');
                return;
            }
            
            if (contraseña !== confirmar) {
                showError('Las contraseñas no coinciden');
                return;
            }
            
            if (!document.getElementById('terminos').checked) {
                showError('Debe aceptar los términos de servicio');
                return;
            }
            
            // Mostrar loader
            document.getElementById('btnText').style.display = 'none';
            document.getElementById('btnLoader').style.display = 'inline';
            document.getElementById('registerBtn').disabled = true;
            
            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        nombre,
                        usuario,
                        correo,
                        contraseña,
                        confirmar_contraseña: confirmar,
                        telefono: telefono || null
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showSuccess('¡Registro exitoso! Redirigiendo al login...');
                    setTimeout(() => {
                        window.location.href = '/login.html';
                    }, 2000);
                } else {
                    showError(data.error || 'Error al registrar');
                    resetButton();
                }
            } catch (error) {
                showError('Error de conexión. Verifica tu internet.');
                resetButton();
            }
        });

        function showError(msg) {
            document.getElementById('errorMessage').textContent = msg;
            document.getElementById('errorMessage').style.display = 'block';
            document.getElementById('successMessage').style.display = 'none';
        }

        function showSuccess(msg) {
            document.getElementById('successMessage').textContent = msg;
            document.getElementById('successMessage').style.display = 'block';
            document.getElementById('errorMessage').style.display = 'none';
        }

        function resetButton() {
            document.getElementById('btnText').style.display = 'inline';
            document.getElementById('btnLoader').style.display = 'none';
            document.getElementById('registerBtn').disabled = false;
        }

        function handleGoogleRegister() {
            alert('Para usar Google Register:\n\n1. Ve a Google Cloud Console\n2. Crea credenciales OAuth 2.0\n3. Configura CLIENT_ID en .env\n4. Reinicia el servidor');
        }
    </script>
</body>
</html>
