<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - AndyAxcel</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <h1>🎬 AndyAxcel</h1>
            <h2>Iniciar Sesión</h2>
            
            <!-- Google Login -->
            <button class="btn-google" onclick="handleGoogleLogin()">
                <span style="font-size:1.2rem;">G</span> Continuar con Google
            </button>
            
            <div class="auth-divider"><span>o inicia sesión con tu correo</span></div>
            
            <!-- Login Form -->
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" name="email" 
                           placeholder="ejemplo@gmail.com" required autocomplete="email">
                </div>
                
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" 
                           placeholder="Tu contraseña" required autocomplete="current-password">
                </div>
                
                <div class="form-options">
                    <label>
                        <input type="checkbox" id="remember" name="remember">
                        Recordar sesión
                    </label>
                    <a href="recuperar-password.html">¿Olvidaste tu contraseña?</a>
                </div>
                
                <div id="errorMessage" class="alert alert-error" style="display:none;"></div>
                <div id="successMessage" class="alert alert-success" style="display:none;"></div>
                
                <button type="submit" class="btn btn-primary btn-full" id="loginBtn">
                    <span id="btnText">Iniciar Sesión</span>
                    <span id="btnLoader" style="display:none;">⏳ Cargando...</span>
                </button>
            </form>
            
            <p class="auth-footer">
                ¿No tienes una cuenta? <a href="registro.html">Regístrate aquí</a>
            </p>
        </div>
    </div>

    <script src="js/main.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const remember = document.getElementById('remember').checked;
            
            // Validaciones
            if (!email || !password) {
                showError('Todos los campos son requeridos');
                return;
            }
            
            if (!email.endsWith('@gmail.com')) {
                showError('Debe usar un correo de Gmail (@gmail.com)');
                return;
            }
            
            // Mostrar loader
            document.getElementById('btnText').style.display = 'none';
            document.getElementById('btnLoader').style.display = 'inline';
            document.getElementById('loginBtn').disabled = true;
            
            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        correo: email,
                        contraseña: password,
                        recordar: remember
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showSuccess('¡Inicio de sesión exitoso! Redirigiendo...');
                    
                    // Redirigir según rol
                    setTimeout(() => {
                        if (data.data.user.rol === 'ADMIN') {
                            window.location.href = '/admin.html';
                        } else {
                            window.location.href = '/index.html';
                        }
                    }, 1000);
                } else {
                    showError(data.error || 'Error al iniciar sesión');
                    resetButton();
                }
            } catch (error) {
                showError('Error de conexión. Verifica tu internet.');
                resetButton();
            }
        });

        function showError(msg) {
            const el = document.getElementById('errorMessage');
            el.textContent = msg;
            el.style.display = 'block';
            document.getElementById('successMessage').style.display = 'none';
        }

        function showSuccess(msg) {
            const el = document.getElementById('successMessage');
            el.textContent = msg;
            el.style.display = 'block';
            document.getElementById('errorMessage').style.display = 'none';
        }

        function resetButton() {
            document.getElementById('btnText').style.display = 'inline';
            document.getElementById('btnLoader').style.display = 'none';
            document.getElementById('loginBtn').disabled = false;
        }

        function handleGoogleLogin() {
            alert('Para usar Google Login:\n\n1. Ve a Google Cloud Console\n2. Crea credenciales OAuth 2.0\n3. Configura CLIENT_ID en .env\n4. Reinicia el servidor');
        }
    </script>
</body>
</html>
